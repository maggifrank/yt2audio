<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset=".55" stop-color="#c850c0"/>
      <stop offset="1" stop-color="#4158d0"/>
    </linearGradient>
    <radialGradient id="shine" cx=".3" cy=".25" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- vinyl record -->
  <circle cx="236" cy="286" r="178" fill="#15131c"/>
  <g fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="5">
    <circle cx="236" cy="286" r="152"/>
    <circle cx="236" cy="286" r="128"/>
    <circle cx="236" cy="286" r="104"/>
  </g>
  <path d="M130 196 A140 140 0 0 1 216 150" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="12" stroke-linecap="round"/>
  <!-- label: the play button that became a record -->
  <circle cx="236" cy="286" r="74" fill="#ff3b3b"/>
  <path d="M212 246 L284 286 L212 326 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <!-- music note bouncing out -->
  <g transform="rotate(14 400 140)">
    <path d="M384 62 v132" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <path d="M384 62 c28 6 56 24 60 60 c-14-18-34-24-60-22" fill="#fff"/>
    <ellipse cx="358" cy="198" rx="40" ry="31" transform="rotate(-22 358 198)" fill="#fff"/>
  </g>
  <!-- sparkles -->
  <path d="M458 262 l9 21 21 9 -21 9 -9 21 -9 -21 -21 -9 21 -9 z" fill="#ffe66d"/>
  <path d="M300 58 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" fill="#ffe66d"/>
</svg>
